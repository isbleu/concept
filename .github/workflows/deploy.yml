name: Deploy to Google VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} -p ${{ secrets.VPS_PORT }} << 'EOF'
            cd /home/chopin_soul/concept
            # 1. 备份本地数据文件
            cp src/data/concepts.json /tmp/concepts.json.bak
            # 2. 只恢复 package.json 和 package-lock.json（解决依赖冲突）
            git checkout -- package.json package-lock.json
            # 3. 拉取远程更新
            git pull origin main
            # 4. 恢复本地数据文件
            cp /tmp/concepts.json.bak src/data/concepts.json
            # 5. 安装依赖并重启
            npm install
            pm2 restart concept
          EOF
